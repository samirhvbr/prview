services:
  prview:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
